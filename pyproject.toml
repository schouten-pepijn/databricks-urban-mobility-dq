[project]
name = "urban-mobility-dq"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pepijn Schouten", email = "pepijn.schouten@flynth.nl" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
urban-mobility-dq = "urban_mobility_dq:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
