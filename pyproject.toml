[project]
name = "urban-mobility-dq"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pepijn Schouten", email = "pepijn.sch@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
urban-mobility-dq = "urban_mobility_dq:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
